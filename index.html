<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>번호 버튼</title>
<style>
  body { font-family: sans-serif; padding: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .item img { width: 80px; height: 80px; display: block; }
  .item button { padding: 8px 20px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
  <h1>번호 버튼</h1>
  <div class="grid" id="grid"></div>

  <script>
    var grid = document.getElementById('grid');
    var colors = ['#e57373','#f06292','#ba68c8','#7986cb','#4fc3f7','#4db6ac','#81c784','#dce775','#ffb74d','#a1887f'];

    function sample(n, color) {
      var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80">' +
        '<rect width="80" height="80" fill="' + color + '"/>' +
        '<text x="40" y="52" font-size="36" text-anchor="middle" fill="#fff" font-family="sans-serif">' + n + '</text></svg>';
      return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    }

    for (var i = 1; i <= 10; i++) {
      var item = document.createElement('div');
      item.className = 'item';

      var img = document.createElement('img');
      img.src = sample(i, colors[i - 1]);
      img.width = 80;
      img.height = 80;
      img.alt = '샘플 이미지 ' + i;

      var btn = document.createElement('button');
      btn.textContent = i + '번';
      btn.addEventListener('click', (function (n) {
        return function () { alert(n); };
      })(i));

      item.appendChild(img);
      item.appendChild(btn);
      grid.appendChild(item);
    }
  </script>
</body>
</html>
